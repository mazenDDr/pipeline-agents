<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" role="img" aria-labelledby="title"><title id="title">All nine graph nodes, grouped by stage; benchmark scoring runs outside the graph</title><style>
.bg{fill:#ECEEF1}.card{fill:#FFFFFF;stroke:#DCE0E6}.accent{stroke:#2D5BD6;stroke-width:1.6}
.lab{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6B7480;letter-spacing:.1em}
.hd{font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171B21}
.body{font:400 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4A535F}
.tiny{font:400 10px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6B7480}
.mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#171B21}
.big{font:600 30px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171B21}
.blue{fill:#2D5BD6}.ok{fill:#2E7D4F}.bad{fill:#C0392B}
.rule{stroke:#DCE0E6;stroke-width:1}.ci{stroke:#4A535F;stroke-width:1.5}
.bar{fill:#2D5BD6;transform-box:fill-box;transform-origin:left center;animation:grow 11s infinite}
.bar.other{fill:#8A93A1}.reveal{animation:show 11s infinite}.late{animation:late 11s infinite}
@keyframes grow{0%,8%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
@keyframes show{0%,10%{opacity:0}28%,100%{opacity:1}}
@keyframes late{0%,32%{opacity:0}48%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect class="bg" width="880" height="354" rx="14"/><text x="28" y="28" class="lab">EACH STEP LEAVES EVIDENCE THE NEXT ONE CAN INSPECT</text><g class="reveal" style="animation-delay:0.0s"><rect x="28" y="44" width="152" height="132" rx="7" class="card"/><text x="40" y="66" class="lab blue">01 · PROFILE</text><text x="40" y="91" class="hd">Read the task</text><text x="40" y="114" class="tiny">Data dictionary, row</text><text x="40" y="133" class="tiny">counts, columns and</text><text x="40" y="152" class="tiny">memory.</text><text x="40" y="196" class="tiny">init → RunState</text><text x="183" y="116" class="body">→</text></g><g class="reveal" style="animation-delay:0.45s"><rect x="196" y="44" width="152" height="132" rx="7" class="card"/><text x="208" y="66" class="lab blue">02 · PLAN</text><text x="208" y="91" class="hd">Make a plan</text><text x="208" y="114" class="tiny">Ordered steps,</text><text x="208" y="133" class="tiny">acceptance checks and</text><text x="208" y="152" class="tiny">a typed reply.</text><text x="208" y="196" class="tiny">plan → Plan</text><text x="351" y="116" class="body">→</text></g><g class="reveal" style="animation-delay:0.9s"><rect x="364" y="44" width="152" height="132" rx="7" class="card"/><text x="376" y="66" class="lab blue">03 · EXECUTE</text><text x="376" y="91" class="hd">Write one step</text><text x="376" y="114" class="tiny">Run Python with Linux</text><text x="376" y="133" class="tiny">isolation and resource</text><text x="376" y="152" class="tiny">limits.</text><text x="376" y="196" class="tiny">execute → files</text><text x="519" y="116" class="body">→</text></g><g class="reveal" style="animation-delay:1.35s"><rect x="532" y="44" width="152" height="132" rx="7" class="card"/><text x="544" y="66" class="lab blue">04 · CHECK</text><text x="544" y="91" class="hd">Inspect the files</text><text x="544" y="114" class="tiny">Tools inspect</text><text x="544" y="133" class="tiny">artifacts. Critic</text><text x="544" y="152" class="tiny">judges findings.</text><text x="544" y="196" class="tiny">validate → critic</text><text x="687" y="116" class="body">→</text></g><g class="reveal" style="animation-delay:1.8s"><rect x="700" y="44" width="152" height="132" rx="7" class="card accent"/><text x="712" y="66" class="lab blue">05 · DELIVER</text><text x="712" y="91" class="hd">Run it clean</text><text x="712" y="114" class="tiny">Assemble the steps.</text><text x="712" y="133" class="tiny">Smoke-test</text><text x="712" y="152" class="tiny">predictions.</text><text x="712" y="196" class="tiny">deliver → pipeline.py</text></g><rect x="28" y="218" width="264" height="65" rx="7" class="card"/><text x="40" y="241" class="mono blue">revise</text><text x="40" y="264" class="tiny">Repair → execute; escalate → plan</text><rect x="308" y="218" width="264" height="65" rx="7" class="card"/><text x="320" y="241" class="mono blue">advance</text><text x="320" y="264" class="tiny">Accepted → next step or deliver</text><rect x="588" y="218" width="264" height="65" rx="7" class="card"/><text x="600" y="241" class="mono blue">human</text><text x="600" y="264" class="tiny">Low confidence / exhausted re-plans</text><text x="28" y="312" class="tiny">Logic failure → revise. Infrastructure failure → retry. Delivery failure → revise. Every node checkpoints its state.</text><text x="28" y="334" class="lab blue">OUTSIDE THE GRAPH</text><text x="174" y="334" class="tiny">Benchmark checker → hidden labels and scores. New uploads have no hidden checker.</text></svg>
