<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" role="img" aria-labelledby="title"><title id="title">Three separate memory stores with different retrieval rules and recipients</title><style>
.bg{fill:#ECEEF1}.card{fill:#FFFFFF;stroke:#DCE0E6}.accent{stroke:#2D5BD6;stroke-width:1.6}
.lab{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6B7480;letter-spacing:.1em}
.hd{font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171B21}
.body{font:400 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4A535F}
.tiny{font:400 10px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6B7480}
.mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#171B21}
.big{font:600 30px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171B21}
.blue{fill:#2D5BD6}.ok{fill:#2E7D4F}.bad{fill:#C0392B}
.rule{stroke:#DCE0E6;stroke-width:1}.ci{stroke:#4A535F;stroke-width:1.5}
.bar{fill:#2D5BD6;transform-box:fill-box;transform-origin:left center;animation:grow 11s infinite}
.bar.other{fill:#8A93A1}.reveal{animation:show 11s infinite}.late{animation:late 11s infinite}
@keyframes grow{0%,8%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
@keyframes show{0%,10%{opacity:0}28%,100%{opacity:1}}
@keyframes late{0%,32%{opacity:0}48%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect class="bg" width="880" height="274" rx="14"/><text x="28" y="28" class="lab">MEMORY HAS THREE DIFFERENT JOBS</text><rect x="28" y="48" width="264" height="175" rx="7" class="card"/><text x="44" y="76" class="hd">Semantic facts</text><text x="44" y="104" class="body">File name + first line identify</text><text x="44" y="123" class="body">the dataset. Retrieve facts about</text><text x="44" y="142" class="body">its columns and units.</text><g class="late"><text x="44" y="201" class="mono blue">init → Planner + Executor</text></g><rect x="308" y="48" width="264" height="175" rx="7" class="card"/><text x="324" y="76" class="hd">Procedural skills</text><text x="324" y="104" class="body">Mine accepted steps from passing</text><text x="324" y="123" class="body">dev runs. Retrieve by similarity</text><text x="324" y="142" class="body">to the current step.</text><g class="late"><text x="324" y="201" class="mono blue">execute → Executor</text></g><rect x="588" y="48" width="264" height="175" rx="7" class="card"/><text x="604" y="76" class="hd">Past episodes</text><text x="604" y="104" class="body">Retrieve similar goals and</text><text x="604" y="123" class="body">profiles. Exclude episodes from</text><text x="604" y="142" class="body">this same task.</text><g class="late"><text x="604" y="201" class="mono blue">init → Planner</text></g><text x="28" y="252" class="tiny">All stores: 0.71 vs 0.50 without memory. Paired +0.21 [0.00, 0.42] includes zero.</text></svg>
