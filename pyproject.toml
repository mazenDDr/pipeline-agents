[project]
name = "pipeline-agents"
version = "0.1.0"
description = "A multi-agent system (planner, executor, critic, reviser) that builds data pipelines, with a measured model harness: prompt registry, memory, budgets and an observer"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "numpy>=1.26",
  "pandas>=2.2,<3",  # the GPU machine's env runs 2.3; pandas 3 changes text dtypes
  "scikit-learn>=1.5,<1.9",  # match the GPU machine (1.8)
  "openai>=1.40",
  "jinja2>=3.1",
  # Pinned to the GPU machine's env, where runs happen (checked 2026-09-17).
  "langgraph==1.0.8",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-core==1.2.13",
  "langgraph-prebuilt==1.0.7",
]

[project.optional-dependencies]
docs = ["markdown>=3.7,<4"]
dev = ["pytest>=8.2", "ruff>=0.5", "playwright>=1.44"]  # playwright: checking the app in real Chrome
app = ["streamlit>=1.36"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Benchmark solutions are short scripts written the way an agent would write them.
"benchmark/solutions/**" = ["SIM115"]
