[project]
name = "pipeline-agents"
version = "0.1.0"
description = "A multi-agent system (planner, executor, critic, reviser) that builds data pipelines, with a measured model harness: prompt registry, memory, budgets and an observer"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
