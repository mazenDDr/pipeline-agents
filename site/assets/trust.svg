<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 258" width="880" height="258" role="img" aria-labelledby="title"><title id="title">Critic audit: agreement, overly strict and overly lenient verdicts from reference labels</title><style>
.bg{fill:#ECEEF1}.card{fill:#FFFFFF;stroke:#DCE0E6}.accent{stroke:#2D5BD6;stroke-width:1.6}
.lab{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6B7480;letter-spacing:.1em}
.hd{font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171B21}
.body{font:400 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#4A535F}
.tiny{font:400 10px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6B7480}
.mono{font:400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#171B21}
.big{font:600 30px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#171B21}
.blue{fill:#2D5BD6}.ok{fill:#2E7D4F}.bad{fill:#C0392B}
.rule{stroke:#DCE0E6;stroke-width:1}.ci{stroke:#4A535F;stroke-width:1.5}
.bar{fill:#2D5BD6;transform-box:fill-box;transform-origin:left center;animation:grow 11s infinite}
.bar.other{fill:#8A93A1}.reveal{animation:show 11s infinite}.late{animation:late 11s infinite}
@keyframes grow{0%,8%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
@keyframes show{0%,10%{opacity:0}28%,100%{opacity:1}}
@keyframes late{0%,32%{opacity:0}48%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect class="bg" width="880" height="258" rx="14"/><text x="28" y="28" class="lab">CHECK THE CRITIC BEFORE TRUSTING ITS VERDICTS</text><rect x="28" y="48" width="264" height="128" rx="7" class="card"/><text x="44" y="78" class="hd">Agreed with labels</text><g class="reveal"><text x="44" y="126" class="big blue">33</text></g><text x="103" y="126" class="tiny">of 50 reviewed verdicts</text><rect x="308" y="48" width="264" height="128" rx="7" class="card"/><text x="324" y="78" class="hd">Too strict</text><g class="reveal"><text x="324" y="126" class="big bad">13</text></g><text x="383" y="126" class="tiny">of 50 reviewed verdicts</text><rect x="588" y="48" width="264" height="128" rx="7" class="card"/><text x="604" y="78" class="hd">Too lenient</text><g class="reveal"><text x="604" y="126" class="big bad">4</text></g><text x="663" y="126" class="tiny">of 50 reviewed verdicts</text><text x="28" y="210" class="body">Cohen’s κ 0.30 [0.04, 0.54]. One labeller; stratified sample, not a random population estimate.</text><text x="28" y="236" class="tiny">A confident Critic is not ground truth. The hidden checker and the saved artifacts are separate evidence.</text></svg>
