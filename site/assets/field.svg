</style><rect class="bg" width="880" height="272" rx="14"/><text x="28" y="28" class="lab">FRESH DATA · THREE TASKS NEITHER SYSTEM WAS TUNED ON</text><rect x="28" y="48" width="264" height="174" rx="7" class="card"/><text x="44" y="80" class="hd">wine-quality</text><text x="44" y="115" class="mono">Team: 16 calls · 207 s</text><text x="44" y="153" class="mono">Single: 2 calls · 90 s</text><g class="late"><text x="44" y="198" class="lab ok">✓ BOTH PASSED</text></g><rect x="308" y="48" width="264" height="174" rx="7" class="card"/><text x="324" y="80" class="hd">student-grades</text><text x="324" y="115" class="mono">Team: 9 calls · 100 s</text><text x="324" y="153" class="mono">Single: 1 calls · 26 s</text><g class="late"><text x="324" y="198" class="lab ok">✓ BOTH PASSED</text></g><rect x="588" y="48" width="264" height="174" rx="7" class="card"/><text x="604" y="80" class="hd">household-power</text><text x="604" y="115" class="mono">Team: 9 calls · 311 s</text><text x="604" y="153" class="mono">Single: 1 calls · 137 s</text><g class="late"><text x="604" y="198" class="lab ok">✓ BOTH PASSED</text></g><text x="28" y="250" class="tiny">Six runs, six passes. A sanity check on unseen datasets, not evidence of a universal success rate.</text></svg>
