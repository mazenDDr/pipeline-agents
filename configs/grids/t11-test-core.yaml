# T11 on the test split: does the multi-agent structure beat one model, and does memory help?
# `memory: sequence` gives each (arm, seed) its own store, starting empty, so a follow-up task can learn from
# its family's warm-up run and nothing crosses between arms or seeds.
name: t11-test-core
tasks: test
seeds: [1, 2, 3]
memory: sequence
arms:
  - {label: baseline, system: baseline, config: configs/run/default.yaml}
  - {label: multi, system: multi, config: configs/run/default.yaml}
  - {label: memall, system: multi, config: configs/run/memory-all.yaml}
